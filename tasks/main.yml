---
- name: Set network_name variable from tezos_network
  ansible.builtin.set_fact:
    network_name: "{{ tezos_network | basename }}"

- name: Set dynamic facts at runtime
  ansible.builtin.set_fact:
    node_rpc_url: "{% if node_rpc_url is defined %}{{ node_rpc_url }}{% else %}http://{{ network_name }}_node:{{ octez_rpc_port_internal }}{% endif %}"
    octez_binary_prefix: "{% if octez_version is version('v15.0', '>=') %}octez{% else %}tezos{% endif %}"

- name: Node data directories
  ansible.builtin.file:
    dest: "{{ item }}"
    state: directory
    owner: "1000"
    mode: '0777'
  with_items:
    - "{{ node_data_dir }}"
    - "{{ client_data_dir }}"

- name: DAL node directory
  ansible.builtin.file:
    dest: "{{ dal_node_data_dir }}"
    state: directory
    owner: "1000"
    mode: '0777'
  when: run_dal_node | default(false)

- name: Check if a tezos-node config.json exists
  ansible.builtin.stat:
    path: "{{ node_data_dir }}/config.json"
  register: has_config

- name: Render tezos tezos-node config file from "{{ tezos_node_config_template }}"
  when: tezos_node_config_template is defined and not has_config.stat.exists
  ansible.builtin.template:
    src: "{{ tezos_node_config_template }}"
    dest: "{{ node_data_dir }}/config.json"
    owner: "100"
    mode: '0755'

- name: Create docker network
  community.docker.docker_network:
    name: "{{ docker_network_name }}"

- name: Docker Volume Container
  community.docker.docker_container:
    name: "{{ network_name }}_node_volumes"
    image: "{{ tezos_docker_image }}"
    state: present
    entrypoint: '/bin/true'
    volumes:
      - "{{ node_data_dir }}:/home/tezos/.tezos-node"
      - "{{ client_data_dir }}:/home/tezos/.tezos-client"
      - "{{ dal_node_data_dir }}:/home/tezos/.tezos-dal-node"

- name: Generate tezos-node config "{{ network_name }}"
  when: not has_config.stat.exists and tezos_node_config_template is undefined
  community.docker.docker_container:
    name: init_tezos_node_config
    image: "{{ tezos_docker_image }}"
    detach: false
    cleanup: true
    entrypoint: "{{ octez_binary_prefix }}-node"
    command: >-
      config init
        --network {{ tezos_network }}
    volumes_from:
      - "{{ network_name }}_node_volumes"

- name: Check if an identity exists
  ansible.builtin.stat:
    path: "{{ node_data_dir }}/identity.json"
  register: has_identity

- name: Generate identity (Can take several minutes)
  community.docker.docker_container:
    name: identity_generate
    image: "{{ tezos_docker_image }}"
    detach: false
    cleanup: true
    entrypoint: "{{ octez_binary_prefix }}-node"
    command: identity generate
    volumes_from:
      - "{{ network_name }}_node_volumes"
  when: not has_identity.stat.exists

- name: Import Tezos snapshot
  ansible.builtin.include_tasks: snapshot_import.yml
  when: snapshot_url is defined

- name: Run tezos node
  community.docker.docker_container:
    name: "{{ network_name }}_node"
    image: "{{ tezos_docker_image }}"
    restart_policy: always
    image_name_mismatch: recreate
    ports:
      - "{{ rpc_port }}:{{ octez_rpc_port_internal }}"
      - "{{ p2p_port }}:{{ octez_p2p_port_internal }}"
      - "{{ octez_metrics_port }}:{{ octez_metrics_port_internal }}"
    network_mode: "{{ docker_network_name }}"
    entrypoint: "{{ octez_binary_prefix }}-node"
    command: >-
      run
        --rpc-addr 0.0.0.0:{{ octez_rpc_port_internal }}
        --allow-all-rpc 0.0.0.0:{{ octez_rpc_port_internal }}
        --history-mode "{{ history_mode }}"
        --cors-origin "*"
        --cors-header "Content-Type"
        --metrics-addr=0.0.0.0:9932
        {{ tezos_node_additional_parameters | join(' ') }}
    # env: "{{ {'TEZOS_CLIENT_UNSAFE_DISABLE_DISCLAIMER': 'YES', 'TEZOS_LOG': 'p2p.* -> debug'} | combine(tezos_node_env_variables) }}"
    env: "{{ {'TEZOS_CLIENT_UNSAFE_DISABLE_DISCLAIMER': 'YES'} | combine(tezos_node_env_variables) }}"
    volumes_from:
      - "{{ network_name }}_node_volumes"
    comparisons:
      env: strict
  when: tezos_node_config_template is not defined
    and tezos_node_host_network is false
    and enable_proxy_sidecar is false

- name: Run tezos node with sidecar proxy
  community.docker.docker_container:
    name: "{{ network_name }}_node"
    image: "{{ tezos_docker_image }}"
    restart_policy: always
    image_name_mismatch: recreate
    ports:
      - "{{ rpc_address }}:{{ octez_rpc_port_internal }}"
      - "{{ p2p_port }}:{{ octez_p2p_port_internal }}"
    network_mode: "{{ docker_network_name }}"
    entrypoint: "{{ octez_binary_prefix }}-node"
    command: >-
      run
        --rpc-addr 0.0.0.0:{{ octez_rpc_port_internal }}
        --allow-all-rpc 0.0.0.0:{{ octez_rpc_port_internal }}
        --history-mode "{{ history_mode }}"
        --cors-origin "*"
        --cors-header "Content-Type"
        --metrics-addr=0.0.0.0:9932
        {{ tezos_node_additional_parameters | join(' ') }}
    # env: "{{ {'TEZOS_CLIENT_UNSAFE_DISABLE_DISCLAIMER': 'YES', 'TEZOS_LOG': 'p2p.* -> debug'} | combine(tezos_node_env_variables) }}"
    env: "{{ {'TEZOS_CLIENT_UNSAFE_DISABLE_DISCLAIMER': 'YES'} | combine(tezos_node_env_variables) }}"
    volumes_from:
      - "{{ network_name }}_node_volumes"
    comparisons:
      env: strict
  when: enable_proxy_sidecar | default(false)

- name: Run tezos node on host network with template
  community.docker.docker_container:
    name: "{{ network_name }}_node"
    image: "{{ tezos_docker_image }}"
    restart_policy: always
    image_name_mismatch: recreate
    network_mode: host
    entrypoint: "{{ octez_binary_prefix }}-node"
    command: >-
      run
        {{ tezos_node_additional_parameters | join(' ') }}
    # env: "{{ {'TEZOS_CLIENT_UNSAFE_DISABLE_DISCLAIMER': 'YES', 'TEZOS_LOG': 'p2p.* -> debug'} | combine(tezos_node_env_variables) }}"
    env: "{{ {'TEZOS_CLIENT_UNSAFE_DISABLE_DISCLAIMER': 'YES'} | combine(tezos_node_env_variables) }}"
    volumes_from:
      - "{{ network_name }}_node_volumes"
    comparisons:
      env: strict
  when: tezos_node_config_template is defined and tezos_node_host_network

- name: Deploy tezos_exporter side car
  community.docker.docker_container:
    name: "tezos_exporter"
    image: "{{ tezos_exporter_docker_image }}"
    restart_policy: always
    command: >
      -tezos-node-url {{ node_rpc_url }}
      -bootstraped-poll-interval 10s
      -bootstraped-threshold 8
    ports:
      - 9489:9489
    networks:
      - name: "{{ network_name }}"
- name: Tezos DAL node
  community.docker.docker_container:
    name: "{{ network_name }}_dal_node"
    image: "{{ tezos_docker_image }}"
    state: "started"
    restart_policy: always
    networks:
      - name: "{{ docker_network_name }}"
    entrypoint: "octez-dal-node"
    command: >-
      run
    ports:
      - "{{ dal_node_address }}:10732"
      - "{{ dal_metrics_address }}:11732"
    volumes_from:
      - "{{ network_name }}_node_volumes"
  when: run_dal_node | default(false)

- name: Check if an tezos-client config.json exists
  ansible.builtin.stat:
    path: "{{ client_data_dir }}/config"
  register: has_client_config

- name: Generate tezos-client config "{{ network_name }}"
  when: not has_client_config.stat.exists
  community.docker.docker_container:
    name: init_tezos_client_config
    image: "{{ tezos_docker_image }}"
    detach: false
    cleanup: true
    entrypoint: "{{ octez_binary_prefix }}-client"
    command: >
      --endpoint {{ node_rpc_url }}
      config init
    networks:
      - name: "{{ docker_network_name }}"
    volumes_from:
      - "{{ network_name }}_node_volumes"
